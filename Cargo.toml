[package]
name = "keel"
version = "0.1.2"
edition = "2021"
description = "Fast, opinionated NAS with a Proxmox-style web GUI"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls-native-roots"] }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std", "fast"] }
getrandom = "0.2"
sha2 = "0.10"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
