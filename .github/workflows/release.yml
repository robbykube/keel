name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            target: x86_64-unknown-linux-gnu
          - name: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the arm64 linker
        if: matrix.name == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Point Cargo at the arm64 linker
        if: matrix.name == 'arm64'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "Cargo.toml version ${version} does not match tag ${tag}" >&2
            exit 1
          fi
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the light Video program (Galène)
        shell: bash
        run: |
          set -euo pipefail
          # Pinned: the tag and the commit it must point at.
          tag=galene-1.2.2
          commit=f2becb441b409881a4bdd2f8f5bbf5d8e9ab28b9
          git clone --quiet --depth 1 --branch "$tag" https://github.com/jech/galene galene-src
          test "$(git -C galene-src rev-parse HEAD)" = "$commit"
          (cd galene-src && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.name }} go build -trimpath -ldflags='-s -w' -o ../galene-bin .)
          # The meeting page loads Keel's call recorder after Galène's own script.
          grep -q '<script src="/galene.js" defer></script>' galene-src/static/galene.html
          sed -i 's#<script src="/galene.js" defer></script>#&\n    <script src="/keel-recording/recorder.js" defer></script>#' galene-src/static/galene.html
          grep -q 'keel-recording/recorder.js' galene-src/static/galene.html
      - name: Package appliance payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/keel
          install -m 0755 "target/${{ matrix.target }}/release/keel" release/keel/keel
          install -m 0644 packaging/systemd/keel.service release/keel/keel.service
          cp -a web release/keel/web
          mkdir -p release/keel/apps/galene
          install -m 0755 galene-bin release/keel/apps/galene/galene
          cp -a galene-src/static release/keel/apps/galene/static
          cp galene-src/LICENCE release/keel/apps/galene/LICENCE 2>/dev/null || cp galene-src/LICENSE release/keel/apps/galene/LICENSE
          tar -C release -czf "keel-linux-${{ matrix.name }}-${GITHUB_REF_NAME}.tar.gz" keel
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: keel-linux-${{ matrix.name }}
          path: keel-linux-${{ matrix.name }}-${{ github.ref_name }}.tar.gz
      - name: Upload the signer
        if: matrix.name == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: keel-signer
          path: target/${{ matrix.target }}/release/keel

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: keel-linux-*
          path: pkgs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: keel-signer
          path: signer
      - name: Sign checksums
        env:
          KEEL_RELEASE_SIGNING_KEY: ${{ secrets.KEEL_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEEL_RELEASE_SIGNING_KEY:-}" ]]; then
            echo "KEEL_RELEASE_SIGNING_KEY is not configured" >&2
            exit 1
          fi
          chmod 0755 signer/keel
          # Keel 0.1.27 on the Pi only looks for the PC file name.
          # This one release puts the Pi program in that file so Install works.
          # The real PC program is kept under a name neither computer installs.
          if [[ "${GITHUB_REF_NAME}" == "v0.1.28" ]]; then
            mv pkgs/keel-linux-amd64-v0.1.28.tar.gz pkgs/keel-linux-pc-v0.1.28.tar.gz
            cp pkgs/keel-linux-arm64-v0.1.28.tar.gz pkgs/keel-linux-amd64-v0.1.28.tar.gz
          fi
          sha256sum pkgs/keel-linux-*.tar.gz > SHA256SUMS
          # The signed names are the file names, not the pkgs/ directory.
          sed -i 's|pkgs/||' SHA256SUMS
          ./signer/keel sign-file SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            pkgs/keel-linux-*.tar.gz \
            SHA256SUMS \
            SHA256SUMS.sig \
            --generate-notes \
            --title "Keel $GITHUB_REF_NAME"
