[Service]
ExecStart=
ExecStart=/usr/lib/keel/start-keel.sh
EnvironmentFile=
# The kiosk on this machine's own screen cannot read the admin token: reading it
# needs a terminal, and the appliance never shows one. Requests from loopback
# are trusted by physical position instead. LAN requests still need the token.
Environment=KEEL_TRUST_LOOPBACK=1

[Unit]
After=keel-network.service
Wants=keel-network.service
