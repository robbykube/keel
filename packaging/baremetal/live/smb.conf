[global]
   workgroup = WORKGROUP
   server string = Keel
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = nobody
   restrict anonymous = 0
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB2
   server max protocol = SMB3
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 50
   include = /var/lib/keel/smb-shares.conf
