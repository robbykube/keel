<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
</head>
<body>
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M3 14.5 12 5l9 9.5-9 4.5-9-4.5z" />
        <path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 5v14" />
      </svg>
      <span>keel</span>
    </div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <div class="scroll">
      <p class="kicker" id="kicker"></p>
      <header>
        <h1 id="title">Home</h1>
      </header>
      <section class="notice" id="notice" hidden></section>
      <section class="card spare-offer" id="spare-offer" hidden>
        <h2 class="home-title">Bring this computer back?</h2>
        <p id="spare-offer-text"></p>
        <div class="actions">
          <button type="button" id="spare-offer-go">Bring it back</button>
        </div>
        <p class="meta" id="spare-offer-status"></p>
      </section>
      <section class="home-grid" id="home"></section>
      <section class="reach" id="reach" hidden>
        <span class="reach-label">From another computer</span>
        <code id="reach-address"></code>
        <button type="button" class="copy-button" id="reach-copy">Copy</button>
        <button type="button" class="help" data-tip="Type this address into a browser on any computer or phone in the house to open this page." aria-label="What is this?" aria-expanded="false">?</button>
      </section>
      <section class="card apps-choice" id="apps-choice" hidden>
        <h2 class="home-title">What will you use Keel for? <button type="button" class="help" data-tip="Pick the apps this house wants. Nothing starts yet; each app opens from Apps when you need it. You can add more later." aria-label="What is this?" aria-expanded="false">?</button></h2>
        <form class="form" id="apps-choice-form">
          <div class="choice-chips" id="apps-choice-rows"></div>
          <div class="actions">
            <button type="submit" id="apps-use" disabled>Use these</button>
            <button type="button" class="texty" id="apps-later">Not now</button>
          </div>
        </form>
        <p class="meta" id="apps-choice-status"></p>
      </section>
      <p class="meta" id="apps-again" hidden><button type="button" class="texty" id="apps-show">Choose apps</button></p>
      <p class="glance" id="rest"></p>
      <details class="why" id="details">
        <summary>Details</summary>
        <div id="detail-body"></div>
      </details>
      <p class="meta" data-only="windows">Practice copy: disks here are pretend.</p>
    </div>
  </main>
  <script src="/platform.js"></script>
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
  <script src="/terms.js"></script>
  <script src="/app.js"></script>
</body>
</html>
