<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Away</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span>keel</span></div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <div class="scroll">
    <header><h1>Away</h1><div class="meta" id="state"></div></header>
    <p class="lede">Your files, outside the house.</p>
    <div class="work-split">
      <div class="work-col">
        <h2>Now</h2>
        <div class="card" id="current">checking…</div>
      </div>
      <div class="work-col">
        <h2>Connect this computer <button type="button" class="help" data-tip="Away is a private connection between your devices (Tailscale, or a server you run). Once this computer joins, the same Files address works anywhere." aria-label="What is this?" aria-expanded="false">?</button></h2>
        <div id="install-block" hidden>
          <p>Away needs its program first.</p>
          <button type="button" id="install">Install</button>
        </div>
        <div id="install-progress" hidden>
          <p class="install-message" id="install-message" aria-live="polite"></p>
          <div class="install-bar" id="install-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="install-fill"></span>
          </div>
        </div>
        <form class="form" id="form" hidden>
          <label>Connection
            <select id="provider">
              <option value="headscale">A computer you run</option>
              <option value="tailscale">Tailscale</option>
            </select>
          </label>
          <label>Name for this computer
            <input id="hostname" placeholder="keel" />
          </label>
          <label class="wide">Address
            <input id="control" placeholder="https://example.com" />
          </label>
          <label class="wide">One-time key
            <input id="key" type="password" autocomplete="off" required />
          </label>
          <button type="submit">Connect</button>
        </form>
        <p class="meta" id="result"></p>
        <h2>Locked page <button type="button" class="help" data-tip="Serves this page at the Away name with a lock the browser trusts. The Passwords app needs that. The Keel screen is not affected." aria-label="What is this?" aria-expanded="false">?</button></h2>
        <p class="meta" id="locked"></p>
        <button type="button" id="lockpage">Lock the page</button>
      </div>
    </div>
    <h2>From outside the house <button type="button" class="help" data-tip="Ask the router opens TCP 80 and 443 for the app names, and UDP 10000 to 10019 for calls, to this computer only. Most routers allow it without a password. Keel renews it every 20 minutes; Stop takes it back. Away works either way." aria-label="What is this?" aria-expanded="false">?</button></h2>
    <section class="card outside-card" id="outside">
      <div class="app-head"><h3>Can people outside reach the apps?</h3><span class="pill" id="outside-pill">Checking</span></div>
      <p id="outside-sentence">Checking the router.</p>
      <p class="meta" id="outside-note"></p>
      <div class="actions">
        <button type="button" id="outside-ask" hidden>Ask the router</button>
        <button type="button" id="outside-stop" hidden>Stop asking the router</button>
        <button type="button" class="texty" id="outside-again">Check again</button>
      </div>
    </section>
    </div>
  </main>
  <script src="/overlay.js"></script>
</body>
</html>
