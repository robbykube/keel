<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Files</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M3 14.5 12 5l9 9.5-9 4.5-9-4.5z" />
        <path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 5v14" />
      </svg>
      <span>keel</span>
    </div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <header>
      <h1>Files</h1>
    </header>
    <p class="lede" id="lede">The house's shared folders.</p>
    <div class="notes-split">
      <div class="roster-col">
        <div class="roster scroll" id="folders"></div>
        <form class="folder-tools" id="newsection">
          <label>New section <button type="button" class="help" data-tip="A section groups folders in the list on the left. Make one, then move folders into it." aria-label="What is this?" aria-expanded="false">?</button> <input id="sectionname" maxlength="80" placeholder="Family" autocomplete="off" spellcheck="false" /></label>
          <button type="submit">Add</button>
        </form>
        <p class="meta" id="sectionstatus"></p>
        <details class="why">
          <summary>Who opens these folders</summary>
          <p class="meta" id="ownerwhy">Checking…</p>
          <form class="form" id="ownerform">
            <label>Name <input id="ownername" autocomplete="username" spellcheck="false" placeholder="your first name, small letters" /></label>
            <label>Password <input id="ownerpass" type="password" autocomplete="new-password" /></label>
            <label>Same password again <input id="ownerpass2" type="password" autocomplete="new-password" /></label>
            <button type="submit" id="ownergo">Use this name</button>
          </form>
          <p class="meta" id="ownerstatus"></p>
        </details>
        <details class="why">
          <summary>Open these from another computer</summary>
          <p>Paste this into the File Explorer address bar. Until a name is set under "Who opens these folders", anyone in the house can open them.</p>
          <p class="meta" id="access"></p>
        </details>
        <details class="why">
          <summary>Add another name</summary>
          <form class="form" id="form">
            <label>Name people will see <input name="name" required placeholder="photos" /></label>
            <label>Which disks <select name="pool" id="pool"></select></label>
            <label class="wide">Folder <input name="path" placeholder="leave blank for all of them" /></label>
            <button type="submit">Add</button>
          </form>
          <p class="meta" id="addstatus"></p>
        </details>
      </div>
      <div class="work-col">
        <p class="crumb" id="crumb"></p>
        <form class="folder-tools" id="newfolder">
          <label>New folder <input id="newname" placeholder="Bills and Taxes" /></label>
          <button type="submit">Make folder</button>
        </form>
        <p class="meta" id="status"></p>
        <div class="table-wrap scroll">
          <table>
            <thead>
              <tr><th>Name</th><th></th><th>Size</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="pending-bar" id="pending" hidden>
          <span id="pendingtext"></span>
          <button type="button" id="put">Put it here</button>
          <button type="button" id="cancel">Cancel</button>
        </p>
      </div>
    </div>
    <div class="photo-viewer" id="file-viewer" hidden>
      <div class="viewer-bar">
        <div class="viewer-steps">
          <button type="button" class="button" id="file-back">Back</button>
          <button type="button" id="file-prev">Previous</button>
          <span class="viewer-count" id="file-count" aria-live="polite"></span>
          <button type="button" id="file-next">Next</button>
        </div>
        <a class="button" id="file-download">Download</a>
      </div>
      <div class="viewer-stage"><img id="file-image" alt="" draggable="false" fetchpriority="high"></div>
      <p class="crop-note" id="file-name"></p>
    </div>
  </main>
  <script src="/platform.js"></script>
  <script src="/terms.js"></script>
  <script src="/shares.js"></script>
</body>
</html>
