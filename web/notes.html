<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Notes</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M3 14.5 12 5l9 9.5-9 4.5-9-4.5z" />
        <path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 5v14" />
      </svg>
      <span>keel</span>
    </div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <header>
      <h1>Notes</h1>
    </header>
    <p class="lede">Ideas for later.</p>
    <div class="notes-split">
      <div class="roster-col">
        <p class="actions">
          <button type="button" id="new">New</button>
          <button type="button" id="remove">Delete</button>
        </p>
        <div class="roster scroll" id="roster"></div>
      </div>
      <div class="editor">
        <div class="editor-bar">
          <label class="wide">Title <input id="title" placeholder="something to add" /></label>
          <button type="button" id="save">Save</button>
        </div>
        <p class="meta" id="status"></p>
        <textarea id="body" placeholder="What you want, and why"></textarea>
      </div>
    </div>
  </main>
  <script src="/notes.js"></script>
</body>
</html>
