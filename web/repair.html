<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Repair</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M3 14.5 12 5l9 9.5-9 4.5-9-4.5z" />
        <path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 5v14" />
      </svg>
      <span>keel</span>
    </div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <header>
      <h1>Repair</h1>
      <div class="meta" id="banner"></div>
    </header>
    <p class="lede">Problems, and safe buttons to fix them.</p>
    <div class="work-split">
      <div class="work-col">
        <h2>Issues</h2>
        <div class="scroll opps-grid" id="items"></div>
      </div>
      <div class="work-col">
        <div class="dock">
          <h2>Fixes <button type="button" class="help" data-tip="Every button here is safe to press. A grey one does not apply to this computer right now." aria-label="What is this?" aria-expanded="false">?</button></h2>
          <p id="playbook"></p>
          <p class="meta" id="status"></p>
          <h2>Phone <button type="button" class="help" data-tip="When something needs fixing, Keel sends one message to the free ntfy app. The phone must be on Away." aria-label="What is this?" aria-expanded="false">?</button></h2>
          <p class="meta" id="phone"></p>
          <button type="button" id="phonesend">Send to the phone</button>
        </div>
      </div>
    </div>
  </main>
  <script src="/platform.js"></script>
  <script src="/terms.js"></script>
  <script src="/repair.js"></script>
</body>
</html>
