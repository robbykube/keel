<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Photos</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span>keel</span></div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <div class="scroll">
      <header><h1>Photos</h1></header>
      <p class="lede" id="note">Pictures and videos in Media.</p>
      <div class="category-list" id="categories"></div>
      <p class="photo-back" id="back" hidden><button type="button" class="button">Back</button></p>
      <div class="photo-grid" id="grid"></div>
      <div id="more" hidden></div>
    </div>
    <div class="photo-viewer" id="viewer" hidden>
      <div class="viewer-bar">
        <div class="viewer-steps">
          <button type="button" class="button" id="viewer-back">Back</button>
          <button type="button" id="viewer-prev">Previous</button>
          <span class="viewer-count" id="viewer-count" aria-live="polite"></span>
          <button type="button" id="viewer-next">Next</button>
          <button type="button" id="viewer-fit" hidden>Fit</button>
          <a class="button" id="viewer-download">Download</a>
        </div>
        <div class="crop-shapes" id="crop-shapes" role="group" aria-label="Try a crop">
          <button type="button" data-ratio="" aria-pressed="true">Whole</button>
          <button type="button" data-ratio="1" title="1:1">Square</button>
          <button type="button" data-ratio="1" data-round="1" title="1:1, round">Circle</button>
          <button type="button" data-ratio="0.8" title="4:5">Tall</button>
          <button type="button" data-ratio="1.5" title="3:2">Print</button>
          <button type="button" data-ratio="1.7778" title="16:9">Wide</button>
          <button type="button" data-ratio="0.5625" title="9:16">Phone</button>
        </div>
      </div>
      <div class="viewer-stage" id="viewer-stage">
        <img id="viewer-image" alt="" draggable="false" fetchpriority="high">
        <video id="viewer-video" controls playsinline preload="metadata" hidden></video>
        <div class="crop-area" id="crop-area" hidden>
          <div class="crop-frame" id="crop-frame" tabindex="0" aria-label="Crop frame. Drag it, or use the arrow keys. Plus and minus change its size.">
            <span class="crop-handle" id="crop-handle" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="crop-note crop-tools" id="crop-note" hidden>
        <label class="crop-size">Size <input type="range" id="crop-size" min="15" max="100" step="1" value="100"></label>
        <p>Drag the frame to choose what stays, or its corner to change its size. The picture on the disk is not changed.</p>
      </div>
    </div>
  </main>
  <script src="/photos.js"></script>
</body>
</html>
