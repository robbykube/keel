<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Photos</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span>keel</span></div>
    <nav>
      <a href="/">Home</a>
      <a href="/shares.html">Files</a>
      <a href="/catalog.html">Apps</a>
      <a href="/overlay.html">Away</a>
    </nav>
  </aside>
  <main>
    <div class="scroll">
      <header><h1>Photos</h1></header>
      <p class="lede" id="note">Choose a category. The pictures stay on the disk.</p>
      <div class="category-list" id="categories"></div>
      <p class="photo-back" id="back" hidden><button type="button" class="button">Back</button></p>
      <div class="photo-grid" id="grid"></div>
      <div id="more" hidden></div>
    </div>
    <div class="photo-viewer" id="viewer" hidden>
      <div class="viewer-bar">
        <div class="viewer-steps">
          <button type="button" class="button" id="viewer-back">Back</button>
          <button type="button" id="viewer-prev">Previous</button>
          <span class="viewer-count" id="viewer-count" aria-live="polite"></span>
          <button type="button" id="viewer-next">Next</button>
        </div>
        <div class="crop-shapes" id="crop-shapes" role="group" aria-label="Try a crop">
          <button type="button" data-ratio="" aria-pressed="true">Whole</button>
          <button type="button" data-ratio="1" title="1:1">Square</button>
          <button type="button" data-ratio="0.8" title="4:5">Tall</button>
          <button type="button" data-ratio="1.5" title="3:2">Print</button>
          <button type="button" data-ratio="1.7778" title="16:9">Wide</button>
          <button type="button" data-ratio="0.5625" title="9:16">Phone</button>
        </div>
      </div>
      <div class="viewer-stage" id="viewer-stage">
        <img id="viewer-image" alt="" draggable="false">
        <video id="viewer-video" controls playsinline preload="metadata" hidden></video>
        <div class="crop-area" id="crop-area" hidden>
          <div class="crop-frame" id="crop-frame" tabindex="0" aria-label="Crop frame. Drag it, or use the arrow keys."></div>
        </div>
      </div>
      <p class="crop-note" id="crop-note" hidden>Drag the frame to choose what stays. The picture on the disk is not changed.</p>
    </div>
  </main>
  <script src="/photos.js"></script>
</body>
</html>
