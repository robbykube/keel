<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Logs</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span>keel</span></div>
    <nav>
      <a href="/">Home</a>
      <a href="/shares.html">Files</a>
      <a href="/catalog.html">Apps</a>
      <a href="/overlay.html">Away</a>
    </nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <div class="scroll">
      <header><h1>Logs</h1></header>
      <p class="lede">Notes from Names and the front door. Sign in on this computer to read them.</p>
      <pre class="log-sheet" id="logs">Loading.</pre>
    </div>
  </main>
  <script>
    const logs = document.getElementById("logs");
    fetch("/api/logs", { credentials: "same-origin" }).then(async (res) => {
      const text = await res.text();
      if (!res.ok) {
        logs.textContent = text.trim() || "Sign in first.";
        return;
      }
      try {
        const data = JSON.parse(text);
        logs.textContent = (data.text || "").trim() || "Nothing has been written yet.";
        // #region agent log
        (function () {
          const body = String(data.text || "");
          const keep = (body.match(/program \S+ direct \S+(?: inside \S+)? localhost \S+ house \S+/) || [""])[0];
          const parts = {};
          keep.split(/\s+/).forEach(function (word, i, all) {
            if (i % 2 === 1 && all[i - 1]) parts[all[i - 1]] = word;
          });
          const forward = (body.match(/could not (?:reach the page|enter the program|open)[^\n]*/g) || []).slice(0, 6);
          const listening = (body.match(/tcp [^\n]*:(?:80|81|443|3000|5380)\b[^\n]*/g) || []).slice(0, 12);
          const payload = {sessionId:"3d0276",runId:"pre-fix",hypothesisId:"A",location:"web/logs.html:logs",message:"front door log snapshot",data:{keep:keep,parts:parts,forward:forward,listening:listening,names:(body.match(/keel-names: [^\n]*/) || [""])[0],door:(body.match(/keel-door: [^\n]*/) || [""])[0],pageActive:/\nactive\n/.test(body),hasInside:keep.indexOf(" inside ") !== -1,sigterm:(body.match(/SIGTERM/) || []).length},timestamp:Date.now()};
          fetch("http://127.0.0.1:7681/ingest/d477056d-9f9e-4c55-94e6-d58557ec5337",{method:"POST",headers:{"Content-Type":"application/json","X-Debug-Session-Id":"3d0276"},body:JSON.stringify(payload)}).catch(function () {});
        })();
        // #endregion
      } catch {
        logs.textContent = text.trim() || "Keel could not read the logs.";
      }
    }).catch((err) => {
      logs.textContent = String(err);
    });
  </script>
</body>
</html>
