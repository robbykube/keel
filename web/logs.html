<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>keel · Logs</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/components.css" />
  <link rel="stylesheet" href="/surfaces.css" />
  <script src="/approve.js"></script>
  <script src="/chrome.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span>keel</span></div>
    <nav aria-label="Navigation"></nav>
    <div class="aside-foot" id="health"></div>
  </aside>
  <main>
    <div class="scroll">
      <header><h1>Logs</h1></header>
      <p class="lede">What the apps wrote while they worked.</p>
      <pre class="log-sheet" id="logs">Loading.</pre>
    </div>
  </main>
  <script>
    const logs = document.getElementById("logs");
    fetch("/api/logs", { credentials: "same-origin" }).then(async (res) => {
      const text = await res.text();
      if (!res.ok) {
        logs.textContent = text.trim() || "Sign in first.";
        return;
      }
      try {
        const data = JSON.parse(text);
        logs.textContent = (data.text || "").trim() || "Nothing has been written yet.";
      } catch {
        logs.textContent = text.trim() || "Keel could not read the logs.";
      }
    }).catch((err) => {
      logs.textContent = String(err);
    });
  </script>
</body>
</html>
